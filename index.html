<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Madiha!</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0f0f1b;
            color: white;
            overflow: hidden; /* Prevents scrollbars during animations */
        }

        /* =========================================
           PAGE 1: 3D DOOR ANIMATIONS
        ========================================= */
        #door-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #000;
            z-index: 100;
            perspective: 1200px;
            transition: opacity 1s ease-in-out;
        }

        .door-container {
            width: 60vw;
            height: 70vh;
            display: flex;
            box-shadow: 0 0 50px rgba(255, 105, 180, 0.2);
            border: 5px solid #2a2a35;
        }

        .door {
            width: 50%;
            height: 100%;
            background: linear-gradient(145deg, #1f1f2e, #14141d);
            position: relative;
            transition: transform 2.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .left-door {
            transform-origin: left;
            border-right: 1px solid #000;
        }

        .right-door {
            transform-origin: right;
            border-left: 1px solid #000;
        }

        .door-handle {
            width: 20px;
            height: 60px;
            background: gold;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            border-radius: 5px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .left-handle { right: 10px; }
        .right-handle { left: 10px; }

        #open-btn {
            margin-top: 40px;
            padding: 15px 30px;
            font-size: 1.2rem;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 65, 108, 0.4);
            transition: transform 0.3s, opacity 0.5s;
        }

        #open-btn:hover {
            transform: scale(1.1);
        }

        /* Classes added by JS to open doors */
        .door-open .left-door { transform: rotateY(-110deg); }
        .door-open .right-door { transform: rotateY(110deg); }
        .fade-out { opacity: 0; pointer-events: none; }

        /* =========================================
           MAIN CONTENT & NAVIGATION
        ========================================= */
        #main-content {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            opacity: 1;
            transition: opacity 1s ease-in;
        }

        #main-content.hidden {
            opacity: 0;
            pointer-events: none;
            display: none;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .nav-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 10px 20px;
            border-radius: 20px;
            transition: 0.3s;
        }

        .nav-btn:hover, .nav-btn.active {
            background: rgba(255, 105, 180, 0.3);
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.5);
        }

        /* =========================================
           PAGES
        ========================================= */
        .page {
            position: absolute;
            top: 80px; /* below nav */
            left: 0;
            width: 100%;
            height: calc(100vh - 80px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateY(50px) scale(0.95);
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            visibility: hidden;
        }

        .page.active-page {
            opacity: 1;
            transform: translateY(0) scale(1);
            visibility: visible;
        }

        /* =========================================
           PAGE 2: WELCOME ANIMATION
        ========================================= */
        .glowing-text { text-align: center; }
        .glowing-text h1 {
            font-size: 5rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
        .glowing-text span {
            background: linear-gradient(to right, #f8049c, #fdd54f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            0% { filter: drop-shadow(0 0 10px #f8049c); }
            100% { filter: drop-shadow(0 0 30px #fdd54f); }
        }

        /* =========================================
           PAGE 3: MESSAGE CARD
        ========================================= */
        .message-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            max-width: 600px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .message-card h2 { color: #fdd54f; margin-bottom: 20px; font-size: 2.5rem; }
        .message-card p { font-size: 1.2rem; line-height: 1.8; }

        /* =========================================
           PAGE 4: GALLERY
        ========================================= */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 30px;
            width: 80%;
            max-width: 800px;
        }
        .gallery-item {
            background: rgba(255,255,255,0.05);
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            border: 1px dashed rgba(255,255,255,0.3);
            transition: 0.4s;
            cursor: pointer;
        }
        .gallery-item:hover {
            transform: translateY(-10px) scale(1.05);
            background: rgba(255,105,180,0.2);
            border: 1px solid rgba(255,105,180,0.8);
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.3);
        }
        /* =========================================
   IMAGE FIX FOR GALLERY
========================================= */
.gallery-item {
    overflow: hidden; /* Forces anything too big to stay inside the box */
}

.gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* Crops the image perfectly without squishing it */
    border-radius: 15px; /* Matches the curve of your boxes */
    pointer-events: none; /* Keeps the hover effect smooth */
}
    </style>
</head>
<body>

    <div id="door-wrapper">
        <div class="door-container">
            <div class="door left-door">
                <div class="door-handle left-handle"></div>
            </div>
            <div class="door right-door">
                <div class="door-handle right-handle"></div>
            </div>
        </div>
        <button id="open-btn">Unlock Madiha's Surprise</button>
    </div>

    <main id="main-content" class="hidden">
        
        <nav>
            <button class="nav-btn active" data-target="page-welcome">Home</button>
            <button class="nav-btn" data-target="page-message">Message</button>
            <button class="nav-btn" data-target="page-gallery">Memories</button>
        </nav>

        <section id="page-welcome" class="page active-page">
            <div class="glowing-text">
                <h1>Happy Birthday,<br><span>Budiya!</span></h1>
            </div>
        </section>

        <section id="page-message" class="page">
            <div class="message-card">
                <h2>Wishing you the best!</h2>
                <p>May your day be filled with joy, laughter, and endless happiness. You deserve all the wonderful things life has to offer today and always!</p>
            </div>
        </section>

        <section id="page-gallery" class="page">
            <h2>Beautiful Memories</h2>
            <div class="gallery-grid">
    <div class="gallery-item">
        <img src="image3.jpeg" alt="Memory with Madiha 1">
    </div>
    
    <div class="gallery-item">
        <img src="img9.jpeg" alt="Memory with Madiha 2">
    </div>
    
    <div class="gallery-item">
        <img src="WhatsApp Image 2026-07-06 at 20.34.44.jpeg" alt="Memory with Madiha 3">
    </div>
    
    <div class="gallery-item">
        <img src="img4.jpeg" alt="Memory with Madiha 4">
    </div>
</div>
        </section>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            const doorWrapper = document.getElementById('door-wrapper');
            const doorContainer = document.querySelector('.door-container');
            const openBtn = document.getElementById('open-btn');
            const mainContent = document.getElementById('main-content');
            const navButtons = document.querySelectorAll('.nav-btn');
            const pages = document.querySelectorAll('.page');

            // 1. Door Opening Logic
            openBtn.addEventListener('click', () => {
                // Add class to trigger CSS 3D rotation
                doorContainer.classList.add('door-open');
                openBtn.style.opacity = '0'; // Hide button
                openBtn.style.pointerEvents = 'none'; // Prevent double clicks
                
                // Wait for door animation to finish (2.5s), then fade out wrapper
                setTimeout(() => {
                    doorWrapper.classList.add('fade-out');
                    
                    // Show main content
                    setTimeout(() => {
                        doorWrapper.style.display = 'none';
                        mainContent.style.display = 'flex'; // Fix display block issue
                        // Small delay to allow display:flex to apply before removing hidden class for opacity transition
                        setTimeout(() => {
                            mainContent.classList.remove('hidden');
                        }, 50);
                    }, 1000); // Matches fade-out transition time
                    
                }, 2000); 
            });

            // 2. Page Navigation Logic
            navButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Remove active class from all buttons and pages
                    navButtons.forEach(b => b.classList.remove('active'));
                    pages.forEach(p => p.classList.remove('active-page'));

                    // Add active class to clicked button
                    btn.classList.add('active');

                    // Find the target page and activate it
                    const targetId = btn.getAttribute('data-target');
                    document.getElementById(targetId).classList.add('active-page');
                });
            });
        });
    </script>
</body>
</html>
